abstract: "Enderling et al. (2009) introduced a cellular automaton of cancer stem cells and their non-stem progeny and reported that increasing the spontaneous death rate of non-stem cells can paradoxically make tumours grow larger, by freeing space for stem cell divisions. We re-implemented the model from the compact specification of Poleszczuk and Enderling (2014). The paradox is reproduced: after 180 days, tumours grow from 56,922 cells at a death rate of 0 to 167,773 at 0.2, with 12-fold more stem cells, and about 71 % of cells have no free neighbour, as reported. The published tumour size, about 140,000 cells after 180 days, is not reproduced: reading the migration rule in cell widths gives 60,692 cells, the literal reading 328,155. The size depends steeply on the migration probability and on when spontaneous death is tested, two rules the specification leaves open; the original code could not be found."

