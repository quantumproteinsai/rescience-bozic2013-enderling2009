abstract: "Bozic et al. (2013) modelled the evolution of resistance in metastatic lesions under targeted therapy with a multitype branching process and derived closed-form probabilities of eradication under one or two drugs. We re-implemented the model from the published description and compared simulations with the paper's analytic results and simulation tables. Equation 1 lies inside the 95 % confidence interval of our simulation at 40 of 40 points of their Figure 3. The patient-level failure probabilities of their Table 1 are reproduced for 21 of 22 patients; for the remaining patient, the paper's table and its supplementary data disagree. The cost-of-resistance results of their Table 2 (32 of 32 entries) and the comparison of sequential and simultaneous therapy of their Figure 5 are reproduced. One secondary approximation, the probability that two-step resistance is present at detection, overestimates it: exact event-by-event simulation gives a value 36 % lower than the formula (0.0023 versus 0.0036)."

